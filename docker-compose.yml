services:
  postgres:
    image: postgres:16
    container_name: questbase-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - questbase_pgdata:/var/lib/postgresql/data

volumes:
  questbase_pgdata: